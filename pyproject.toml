[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gtex_tissue_classifier"
version = "0.0.1"
authors = [
	{name="Jared Baas", email="jarbaas@umich.edu" },
]
description = "A bioinformatics tool that predicts tissue origin from unknown RNA-seq profiles using GTEx reference data."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
]

dependencies = [
    "numpy",
    "pandas",
    "requests",
    "matplotlib",
    "seaborn",
    "scipy"
    "pyyaml"
]

[tool.setuptools]
packages = ["gtex_tissue_classifier"]

[project.scripts]
gtex-classifier = "gtex_tissue_classifier.architecture:main"
